<!DOCTYPE html>

  <title>Settings Page</title>
  <link rel="stylesheet" href="./css/setting.css" />

<body>
  

  <div class="setting-container">
    <div class="setting-tab-nav">
      <div class="setting-tab">Courses Management</div>
      <div class="setting-tab">Internship Management</div>
      <div class="setting-tab active-tab">Blog Management</div>
    </div>

    <div class="setting-section-header">

      <button class="setting-add-button">

    </div>

    <div class="setting-blog-list">
      <!-- Blog Card -->
      <div class="setting-blog-card">

            <p>Title</p>
            <p>Join Our Exclusive Online Course Webinar!</p>
          </div>
        </div>

        <div class="setting-blog-image">
          <p>Image</p>
         <p class="imgg">image.png</p>
        </div>

        <div class="setting-blog-modified">
          <p>Modified</p>
          <p>By John Doe | 02/08/2025 | 03:45 PM</p>
        </div>

        <div class="setting-blog-actions">
          <button class="setting-action-btn">
           <img src="../public/images/edit.png" alt="" />
            <span>Edit</span>
          </button>
          <button class="setting-action-btn">
              <img src="../public/images/del.png" alt="" />
            <span>Delete</span>
          </button>
        </div>
        <div class="dropdown-container">
        <div class="flex">
          <div>
            <p>Title</p>

        </div>
